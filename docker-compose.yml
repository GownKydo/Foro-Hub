services:
  web:
    build: .
    container_name: foro_web
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_DEBUG=1
      - DB_HOST=db
      - DB_USER=foro_user
      - DB_PASSWORD=foro_pass
      - DB_NAME=foro_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: foro_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foro_db
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: